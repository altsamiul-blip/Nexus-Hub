<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEXUS HUB — Curated resources. One place.</title>
    <meta
      name="description"
      content="NEXUS HUB is a members-only directory of curated education, technology, AI, development, productivity and design resources."
    />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-blue"></span>
      <span class="orb orb-violet"></span>
      <span class="grain"></span>
    </div>

    <header class="site-header">
      <a class="brand" href="/" data-link>
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 19V5l8 6 8-6v14" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>NEXUS HUB</strong>
          <small>Curated resources. One place.</small>
        </span>
      </a>

      <nav class="site-nav" id="nav" aria-label="Primary">
        <a href="/directory" data-link data-nav="directory">Directory</a>
        <a href="/admin" data-link data-nav="admin" hidden>Admin</a>
        <a href="/account" data-link data-nav="account" hidden>Account</a>
      </nav>

      <div class="header-actions" id="header-actions"></div>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="site-footer">
      <span>NEXUS HUB</span>
      <span class="dot" aria-hidden="true">•</span>
      <span>Curated resources. One place.</span>
      <span class="footer-spacer"></span>
      <span>Approval-based membership</span>
    </footer>

    <div class="toast-stack" id="toasts" aria-live="assertive"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
